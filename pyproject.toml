# TARS-Agent 项目配置（PEP 621 + Hatch 构建 + 常用工具链）

# ---- PEP 517：声明如何构建 wheel/sdist ----
[build-system]
requires = ["hatchling==1.27.0"]          # 构建时需要的后端包
build-backend = "hatchling.build" # 使用 Hatchling 作为构建后端

# ---- 项目元数据与运行时依赖（PEP 621）----
[project]
name = "tars-agent"
version = "0.8.0"
description = "A local persistent agent runtime with controlled tools, sessions and a read-only Web panel."
readme = "README.md"
license = "LicenseRef-TARS-Agent-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "liaoqizai" }]
requires-python = ">=3.12,<3.13" # 仅支持 3.12 小版本范围，与 CI/类型检查一致
dependencies = [
    "pydantic>=2.0",       # 数据校验与序列化（含 JSON 模型等）
    "python-dotenv>=1.0",  # .env 文件解析
    "anthropic>=0.25",     # Anthropic LLM SDK（流式 + prompt caching）
    "textual>=0.75",       # 终端 UI 框架（tars-tui）
    "httpx[socks]>=0.28.1",
    "httpx2>=2.12.0,<3",  # SDK HTTP transport security fixes
    "defusedxml>=0.7.1,<1",  # bounded local JUnit parsing
    "SQLAlchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "mcp==2.0.0",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

# 安装后可在 PATH 中执行的入口：`tars` / `tars-core` / `tars-tui` / `tars-web`
[project.scripts]
tars = "tars_agent.cli.main:main"
tars-core = "tars_agent.core.app:run"
tars-tui = "tars_agent.tui.__main__:main"
tars-web = "tars_agent.web.cli:main"

# ---- Hatch：打 wheel 时从 src 布局收录包 ----
[tool.hatch.build.targets.wheel]
packages = ["src/tars_agent"] # 源码在 src/tars_agent

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ---- 开发期依赖（PEP 735）----
[dependency-groups]
dev = [
    "ruff>=0.4",            # 快速 linter + import 排序等
    "mypy>=1.10",           # 静态类型检查
    "pytest>=8.0",          # 单元测试
    "pytest-asyncio>=0.23", # 异步测试支持
]

qa = [
    "hatchling==1.27.0",
    "build>=1.2.2",
    "coverage[toml]>=7.10.0",
    "diff-cover>=9.2.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.1",
    "pyyaml>=6.0.2",
    "twine>=6.1.0",
    "pywinpty>=3.0.0,<4 ; sys_platform == 'win32'",
]
security = ["bandit[toml]>=1.8.6", "detect-secrets>=1.5.0", "pip-audit>=2.9.0"]

# ---- Ruff：统一代码风格 ----
[tool.ruff]
src = ["src"]            # 分析路径，便于识别第一方代码
line-length = 100        # 行长上限
target-version = "py312" # 语法/规则按 Python 3.12

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # pycodestyle 错误、Pyflakes、isort、pyupgrade
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]   # 测试文件的中文注释允许超过行宽限制
"scripts/**/*.py" = ["E501"] # 脚本文件的文档字符串允许超过行宽限制

# ---- Mypy：严格类型检查 ----
[tool.mypy]
python_version = "3.12"
strict = true                 # 启用严格模式
mypy_path = "src"             # 将 src 加入模块搜索路径
explicit_package_bases = true # 明确包根，减少隐式命名空间误判

# ---- Pytest：默认发现 tests/，异步用例自动管理 event loop ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that call the real Anthropic API (require ANTHROPIC_API_KEY)",
    "docker: marks tests that require a live Docker engine and sandbox image",
    "acceptance: full user-visible acceptance flow",
    "local_integration: local process/socket/filesystem boundary",
    "external: explicitly selected external dependency check",
    "anthropic: explicitly selected real model request",
    "mcp: local MCP protocol boundary",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/web", "/evals", "/docs", "/LICENSE", "/README.md", "/RUNBOOK.md", "/WIRE_PROTOCOL.md", "/pyproject.toml", "/uv.lock", "/Dockerfile", "/alembic.ini", "/.python-version"]
exclude = ["web/node_modules", "web/test-results", "web/playwright-report", "**/__pycache__", "*.log", "*.db", ".env"]

[tool.coverage.run]
branch = true
data_file = "build/qa/.coverage"
parallel = true
patch = ["subprocess"]
relative_files = true
source = ["tars_agent"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "build/qa/coverage.json"

[tool.coverage.xml]
output = "build/qa/coverage.xml"

[tool.bandit]
exclude_dirs = [".venv", "build", "dist", "tests"]
