name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --group qa --group security

      - name: Lockfile, Ruff, Mypy and repository checks
        run: uv run --no-sync python scripts/qa.py quick

      - name: Mypy strict
        run: uv run --no-sync mypy src

      - name: Offline tests and coverage gates
        run: uv run --no-sync python scripts/qa.py coverage

      - name: Scan checked-out candidate and reachable public history
        run: uv run --no-sync python scripts/check_public_content.py --history --refs HEAD

      - name: Audit Python code
        run: uv run --no-sync python -m bandit -c pyproject.toml -r src scripts -ll -ii -f json -o build/qa/bandit.json

      - name: Audit installed locked Python dependencies
        run: uv run --no-sync python -m pip_audit --local --format json --output build/qa/pip-audit.json

      - name: Build sandbox image (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build --tag tars-agent-sandbox:0.8.0 .
          image_id="$(docker image inspect --format '{{.Id}}' tars-agent-sandbox:0.8.0)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CORE_RECOVERY_IMAGE=$image_id" >> "$GITHUB_ENV"

      - name: Real Docker sandbox E2E (Ubuntu)
        if: runner.os == 'Linux'
        env:
          TARS_REQUIRE_DOCKER_E2E: "1"
        run: uv run --no-sync pytest tests/integration/test_docker_sandbox_e2e.py -v

      - name: Real Core crash recovery and instance isolation (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUN_CORE_RECOVERY_DOCKER: "1"
        run: |
          export CORE_RECOVERY_ROOT="$GITHUB_WORKSPACE/build/core-recovery/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-isolation"
          test ! -e "$CORE_RECOVERY_ROOT"
          uv run --no-sync pytest tests/integration/test_docker_core_recovery.py -v --junitxml=build/qa/core-recovery.xml
          uv run --no-sync python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          cases = ET.parse('build/qa/core-recovery.xml').findall('.//testcase')
          assert len(cases) == 1 and all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          result = json.loads((pathlib.Path(os.environ['CORE_RECOVERY_ROOT']) / 'results.json').read_text())
          assert result['passed'] is True and result['errors'] == [] and result['fallback_cleanup'] == []
          assert result['image'] == os.environ['CORE_RECOVERY_IMAGE']
          PY

      - name: Real worker path boundary (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUN_CORE_RECOVERY_DOCKER: "1"
        run: |
          export CORE_RECOVERY_ROOT="$GITHUB_WORKSPACE/build/core-recovery/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-boundary"
          test ! -e "$CORE_RECOVERY_ROOT"
          uv run --no-sync pytest tests/integration/test_docker_worker_path_boundary.py -v --junitxml=build/qa/worker-boundary.xml
          uv run --no-sync python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          cases = ET.parse('build/qa/worker-boundary.xml').findall('.//testcase')
          assert len(cases) == 1 and all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          result = json.loads((pathlib.Path(os.environ['CORE_RECOVERY_ROOT']) / 'results.json').read_text())
          assert result['passed'] is True and result['errors'] == [] and result['full_container_id_absent'] is True
          assert result['image'] == os.environ['CORE_RECOVERY_IMAGE']
          PY

      - name: Offline integration tests
        run: uv run --no-sync pytest tests/integration -m "not integration and not docker" -v

      - name: Verify generated wire protocol
        run: uv run --no-sync python scripts/gen_protocol_doc.py --check

      - name: Verify persistence and Web adapter boundaries
        run: uv run --no-sync python scripts/check_architecture.py

      - name: Build wheel and source distribution
        run: uv run --no-sync python scripts/qa.py build

      - name: Smoke-test isolated wheel install
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath build/qa/dist -Filter '*.whl' |
            Select-Object -First 1).FullName
          if (-not $wheel) { throw 'Built wheel was not found.' }
          uv run --isolated --no-project --with $wheel `
            python -c "import importlib.resources as r; import tars_agent; assert tars_agent.__version__ == '0.8.0'; assert r.files('tars_agent.web').joinpath('static/index.html').is_file()"
          uv run --isolated --no-project --with $wheel `
            python scripts/smoke_installed_web.py

      - name: Verify complete independent wheel installation (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case_root="$RUNNER_TEMP/tars-installed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$case_root"
          mkdir "$case_root"
          uv export --locked --no-default-groups --no-emit-project --format requirements.txt --output-file "$case_root/locked-runtime.txt"
          uv venv --python 3.12 "$case_root/venv"
          uv pip sync --python "$case_root/venv/bin/python" --require-hashes "$case_root/locked-runtime.txt"
          wheels=("$GITHUB_WORKSPACE"/build/qa/dist/*.whl)
          test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}"
          uv pip install --python "$case_root/venv/bin/python" --no-deps "${wheels[0]}"
          cp scripts/verify_installed.py "$case_root/verify_installed.py"
          cmp scripts/verify_installed.py "$case_root/verify_installed.py"
          touch "$case_root/empty-config.toml"
          export INSTALLATION_CASE="$case_root"
          export INSTALLATION_REPORT="$GITHUB_WORKSPACE/build/qa/installed-verification.json"
          export INSTALLATION_WHEEL="${wheels[0]}"
          unset PYTHONPATH PYTHONHOME
          cd "$case_root"
          "$case_root/venv/bin/python" - <<'PY'
          import hashlib, json, os, pathlib, re, sqlite3, subprocess, sys
          root = pathlib.Path(os.environ['INSTALLATION_CASE']).resolve()
          output = pathlib.Path(os.environ['INSTALLATION_REPORT'])
          image = os.environ['CORE_RECOVERY_IMAGE']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', image)
          environment = {
              key: value for key, value in os.environ.items()
              if not key.upper().startswith(('TARS_', 'KAMA_', 'ANTHROPIC_', 'OPENAI_', 'DEEPSEEK_'))
              and not key.upper().endswith('_API_KEY') and key.upper() not in {'PYTHONPATH', 'PYTHONHOME'}
          }
          environment.update(TARS_HOME=str(root / 'home'), TARS_CONFIG=str(root / 'empty-config.toml'),
                             TARS_SANDBOX_MODE='required', TARS_SANDBOX_IMAGE=image,
                             TARS_TRACE_ENABLED='false', TARS_LOG_FILE='')
          completed = subprocess.run([sys.executable, str(root / 'verify_installed.py'), '--output', str(output)],
                                     cwd=root, env=environment, timeout=240, check=False)
          report = json.loads(output.read_text()) if output.exists() else {}
          ledger = root / 'home/acceptance/request-budget.sqlite3'
          requests = 0
          if ledger.exists():
              with sqlite3.connect(ledger.as_uri() + '?mode=ro', uri=True) as connection:
                  requests = connection.execute('SELECT count(*) FROM requests').fetchone()[0]
          report.update(verifier_returncode=completed.returncode, model_requests=requests,
                        wheel_sha256=hashlib.sha256(pathlib.Path(os.environ['INSTALLATION_WHEEL']).read_bytes()).hexdigest(),
                        verifier_sha256=hashlib.sha256((root / 'verify_installed.py').read_bytes()).hexdigest(),
                        locked_runtime_sha256=hashlib.sha256((root / 'locked-runtime.txt').read_bytes()).hexdigest())
          output.write_text(json.dumps(report, indent=2) + '\n')
          assert completed.returncode == 0 and requests == 0
          for field in ('four_entrypoint_help', 'schema_resources', 'installed_core', 'installed_worker', 'installed_web_health'):
              assert report[field] == 'passed', field
          for field in ('core_stopped', 'core_port_closed', 'core_control_removed', 'web_stopped', 'web_port_closed'):
              assert report[field] is True, field
          PY

      - name: Assert and remove orphaned TARS-Agent containers
        if: runner.os == 'Linux' && always()
        run: |
          ids="$(docker ps -aq --filter label=com.tars-agent.sandbox=true)"
          if [ -n "$ids" ]; then
            docker rm -f $ids
            echo "TARS-Agent sandbox containers were orphaned."
            exit 1
          fi

      - name: Prepare sanitized QA diagnostics
        id: qa_artifacts
        if: always()
        run: uv run --no-sync python scripts/qa.py artifacts

      - name: Upload QA diagnostics even on failure
        if: always() && steps.qa_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.os }}-${{ github.sha }}
          path: build/qa/upload/
          if-no-files-found: error
          retention-days: 14

  web-e2e:
    name: Ubuntu Core -> FastAPI -> SSE -> React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked --group qa --group security

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci

      - name: Audit Web dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Type-check and build Web assets
        working-directory: web
        run: |
          npm run typecheck
          npm run build

      - name: Verify committed Web assets are current
        run: git diff --exit-code -- src/tars_agent/web/static

      - name: Install Chromium runtime
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run one real cross-process browser journey
        run: uv run --no-sync python scripts/run_web_e2e.py
